[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/bin/sh -c "/usr/local/bin/storage-init.sh; exec php-fpm -F"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/bin/sh -c "/usr/local/bin/storage-init.sh; exec php artisan queue:work --queue=workflow-actions,workflow-control,default --tries=3 --timeout=90"
directory=/var/www
autostart=true
autorestart=true
; Ride out a slow dependency at boot (database not up yet, volume still mounting)
; instead of burning the default 3 retries in ~5s and parking in FATAL until the
; next deploy — which is how a transient blip turns into a silently dead worker.
startsecs=5
startretries=10
stopwaitsecs=95
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "/usr/local/bin/storage-init.sh; exec php artisan schedule:work"
directory=/var/www
autostart=true
autorestart=true
; Ride out a slow dependency at boot (database not up yet, volume still mounting)
; instead of burning the default 3 retries in ~5s and parking in FATAL until the
; next deploy — which is how a transient blip turns into a silently dead worker.
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
