services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow_automation_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://127.0.0.1:8000}
      RUN_MIGRATIONS: "true"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - storage_data:/var/www/storage

  nginx:
    image: nginx:1.27-alpine
    container_name: workflow_automation_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  storage_data:
