services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: workflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-workflow_automation}
      POSTGRES_USER: ${DB_USERNAME:-workflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workflow_secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-workflow_user} -d ${DB_DATABASE:-workflow_automation}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - workflow_network

  # -------------------------------------------------------------------------
  # Redis 7 (Cache, Session, Queue & Reverb Scaling)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workflow_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - workflow_network

  # -------------------------------------------------------------------------
  # Laravel App (PHP-FPM 8.2)
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www
      - /var/www/vendor
      - storage_data:/var/www/storage
    expose:
      - "9000"
    networks:
      - workflow_network

  # -------------------------------------------------------------------------
  # Nginx Reverse Proxy (Web Server & WebSockets)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: workflow_nginx
    restart: unless-stopped
    depends_on:
      - app
      - reverb
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8180}:8080"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - workflow_network

  # -------------------------------------------------------------------------
  # Laravel Queue Worker (Processes Workflow Execution Nodes & Jobs)
  # -------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - .:/var/www
      - /var/www/vendor
      - storage_data:/var/www/storage
    networks:
      - workflow_network

  # -------------------------------------------------------------------------
  # Laravel Scheduler (Timer scans, admission, expiration)
  # -------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - .:/var/www
      - /var/www/vendor
      - storage_data:/var/www/storage
    networks:
      - workflow_network

  # -------------------------------------------------------------------------
  # Laravel Reverb (Real-time WebSockets Server)
  # -------------------------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow_reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - .:/var/www
      - /var/www/vendor
      - storage_data:/var/www/storage
    networks:
      - workflow_network

  # -------------------------------------------------------------------------
  # Frontend Service (React 19 + Vite Flow Canvas)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workflow_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-workflow-local-key}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${REVERB_PORT:-8180}
      VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    networks:
      - workflow_network

# ---------------------------------------------------------------------------
# Persistent Volumes & Network
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  workflow_network:
    driver: bridge
